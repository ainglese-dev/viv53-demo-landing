name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_CONTACT_FORM_URL: ${{ vars.VITE_CONTACT_FORM_URL }}
          VITE_BOOKING_FORM_URL: ${{ vars.VITE_BOOKING_FORM_URL }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_CONTACT_PHONE: ${{ vars.VITE_CONTACT_PHONE }}
          VITE_CONTACT_PHONE_DISPLAY: ${{ vars.VITE_CONTACT_PHONE_DISPLAY }}
          VITE_ENABLE_SPANISH: ${{ vars.VITE_ENABLE_SPANISH }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_CAL_USERNAME: ${{ vars.VITE_CAL_USERNAME }}
          VITE_BREVO_API_KEY: ${{ secrets.VITE_BREVO_API_KEY }}
          VITE_BREVO_LIST_ID: ${{ vars.VITE_BREVO_LIST_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4